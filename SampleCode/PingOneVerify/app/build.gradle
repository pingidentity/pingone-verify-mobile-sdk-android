plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    compileSdk 35
    namespace 'com.pingidentity.sdk.pingoneverify.sample'
    buildToolsVersion = '34.0.0'

    defaultConfig {
        applicationId "com.pingidentity.sdk.pingoneverify.sample"
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 100
        versionName "4.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        dataBinding true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // Verify Core - Mandatory dependencies for PingOne Verify SDK
    implementation files('../../../SDK/PingOneVerify-4.0.0.aar')
    implementation files('../../../SDK/NeoInterfaces-4.0.0.aar')

    // Microblink dependencies - needed for GeoLocation collection
    implementation files('../../../SDK/GeoLocationProvider-4.0.0.aar')

    // Microblink dependencies - needed for Liveness Verification
    implementation files('../../../SDK/SelfieCaptureProvider-4.0.0.aar')
    implementation files('../../../SDK/iad-2.4.0.aar')
    //Required by SelfieCaptureProvider (iad is api dependency, not bundled in AAR)
    implementation 'androidx.camera:camera-camera2:1.4.0'
    implementation 'androidx.camera:camera-core:1.4.0'
    implementation 'androidx.camera:camera-view:1.4.0'
    implementation 'androidx.camera:camera-lifecycle:1.4.0'
    implementation 'com.google.android.gms:play-services-mlkit-face-detection:17.1.0'

    // Microblink dependencies - needed for Government ID Verification
    implementation files('../../../SDK/IdCaptureProvider-4.0.0.aar')
    implementation files('../../../SDK/blinkid-core-7.6.1.aar')
    //Required by IdCaptureProvider (blinkid-ux is api dependency, not bundled in AAR)
    implementation('com.microblink:blinkid-ux:7.6.1') {
        exclude group: 'com.microblink', module: 'blinkid-core'
    }
    implementation 'com.microblink:microblink-ux:1.5.0'
    implementation 'androidx.camera:camera-video:1.4.2'
    implementation 'androidx.datastore:datastore-preferences:1.1.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-process:2.9.2'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.1'
    implementation 'androidx.compose.material3:material3:1.3.2'

    implementation 'androidx.activity:activity-ktx:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.5.6'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.googlecode.libphonenumber:libphonenumber:8.13.7'
    implementation 'com.google.android.gms:play-services-mlkit-barcode-scanning:18.2.0'
    implementation 'com.google.code.gson:gson:2.9.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    kapt 'com.github.bumptech.glide:compiler:4.16.0'

    implementation 'com.squareup.retrofit2:converter-moshi:2.7.2'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.9.3'
    implementation 'com.squareup.moshi:moshi:1.14.0'
    implementation 'com.squareup.moshi:moshi-kotlin:1.14.0'
    implementation group: 'com.squareup.okhttp3', name: 'okhttp-urlconnection', version: '4.9.3'

    //Important: Below dependencies must be defined for Selfie/Government ID document upload on S3
    implementation 'org.bitbucket.b_c:jose4j:0.9.5'
    //Important: Below dependencies should be defined for Selfie Liveness feature
    implementation 'com.google.protobuf:protobuf-javalite:3.20.1'
    implementation 'com.google.protobuf:protobuf-kotlin-lite:3.20.1'
}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}